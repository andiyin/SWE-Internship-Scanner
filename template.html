<title>Internship Radar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: summary sentence on top, then the scan field (one dot per tracked company) beside the
   location-priority ladder, then listings grouped by that ladder, then the full company register. */
:root {
  --bg: #f2f4f9; --surface: #ffffff; --ink: #141a2b; --muted: #5a637b; --line: #dde2ec;
  --accent: #4326d6; --dot: #cdd4e2; --new: #b4360f;
  --t1: #4326d6; --t2: #1d74e0; --t3: #0b93a8; --t4: #189a62; --t5: #7a9a1e; --t0: #7b8499;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --body: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e111a; --surface: #161a26; --ink: #e9ecf5; --muted: #99a2b9; --line: #272d3d;
  --accent: #a79bff; --dot: #2c3346; --new: #ff9a6b;
  --t1: #a79bff; --t2: #6fb0ff; --t3: #45cfe0; --t4: #4fd69a; --t5: #b7d45a; --t0: #7f889e;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e111a; --surface: #161a26; --ink: #e9ecf5; --muted: #99a2b9; --line: #272d3d;
  --accent: #a79bff; --dot: #2c3346; --new: #ff9a6b;
  --t1: #a79bff; --t2: #6fb0ff; --t3: #45cfe0; --t4: #4fd69a; --t5: #b7d45a; --t0: #7f889e;
  color-scheme: dark }

*, *::before, *::after { box-sizing: border-box }
[hidden] { display: none !important }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body) }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 20px; padding-block: 36px 72px;
  display: flex; flex-direction: column; gap: 44px }
a { color: inherit }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px }
.label { font: 500 11px/1.3 var(--mono); letter-spacing: .09em; text-transform: uppercase; color: var(--muted) }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance }
h2 { font-size: 22px; font-weight: 700 }

/* header */
header { display: flex; flex-direction: column; gap: 14px }
.topline { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px }
h1 { font-size: clamp(30px, 5.2vw, 52px); line-height: 1.05; font-weight: 700; letter-spacing: -.02em; max-width: 18ch }
h1 em { font-style: normal; color: var(--accent) }
.facts { display: flex; flex-wrap: wrap; gap: 8px 28px; margin: 0; color: var(--muted) }
.facts div { display: flex; gap: 8px; align-items: baseline }
.facts dt { order: 2 }
.facts dd { margin: 0; font: 500 17px var(--mono); color: var(--ink); font-variant-numeric: tabular-nums }

/* overview */
.overview { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 36px; align-items: start }
.overview > section { display: flex; flex-direction: column; gap: 14px; min-width: 0 }
.field { display: grid; grid-template-columns: repeat(auto-fill, 16px); gap: 3px; padding: 16px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px }
.dot { width: 16px; height: 16px; padding: 0; border: 0; background: none; display: grid; place-items: center; cursor: pointer }
.dot::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--dot); transition: transform .12s }
.dot.on::before { width: 14px; height: 14px; background: var(--c) }
.dot:hover::before { transform: scale(1.35) }
.dot.dim::before { opacity: .25 }
.hint { color: var(--muted); font-size: 13px; margin: 0; min-height: 1.5em }
.hint b { color: var(--ink); font-weight: 600 }

.ladder { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px }
.rung { width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: baseline; text-align: left;
  padding: 9px 10px; border: 1px solid transparent; border-radius: 8px; background: none; color: inherit; font: inherit; cursor: pointer }
.rung:hover { background: var(--surface) }
.rung[aria-pressed="true"] { background: var(--surface); border-color: var(--line) }
.rung .name { font-weight: 500 }
.rung .n { font: 500 15px var(--mono); font-variant-numeric: tabular-nums }
.rung .track { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--line) }
.rung .bar { display: block; height: 100%; border-radius: 3px; background: var(--c); min-width: 6px }
.rung.zero { color: var(--muted) }
.rung.zero .bar { display: none }

/* listings */
.sec-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px }
.listings, .group { display: flex; flex-direction: column }
.listings { gap: 28px }
.group h3 { display: flex; align-items: center; gap: 10px; font: 500 12px var(--mono); letter-spacing: .09em;
  text-transform: uppercase; color: var(--muted); padding-bottom: 10px; border-bottom: 1px solid var(--line) }
.swatch { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none }
.job { display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr) auto; gap: 6px 24px; align-items: center;
  padding: 16px 0; border-bottom: 1px solid var(--line); scroll-margin-top: 20px }
.job.flash { animation: flash 1.4s ease-out }
@keyframes flash { from { background: color-mix(in srgb, var(--accent) 16%, transparent) } to { background: transparent } }
.job .co { font: 700 19px/1.2 var(--display); display: flex; flex-wrap: wrap; align-items: center; gap: 8px; overflow-wrap: anywhere }
.badge { font: 500 10px var(--mono); letter-spacing: .08em; padding: 2px 6px; border-radius: 4px; color: var(--new); border: 1px solid currentColor }
.job .role { min-width: 0 }
.job .title { font-weight: 500; overflow-wrap: anywhere }
.job .meta { color: var(--muted); font-size: 13px }
.job .acts { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 8px; font-weight: 500; font-size: 14px;
  text-decoration: none; white-space: nowrap; border: 1px solid var(--line); background: var(--surface); color: var(--ink) }
.btn:hover { border-color: var(--ink) }
.btn.go { background: var(--accent); border-color: var(--accent); color: var(--bg) }
.btn.go:hover { filter: brightness(1.12) }
.empty { color: var(--muted); padding: 24px 0; margin: 0 }

/* register */
.tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center }
.search { flex: 1 1 220px; min-width: 0; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); font: inherit }
.seg { display: flex; flex-wrap: wrap; gap: 2px; padding: 3px; border-radius: 9px; background: var(--surface); border: 1px solid var(--line) }
.seg button { padding: 6px 12px; border: 0; border-radius: 6px; background: none; color: var(--muted); font: 500 13px var(--body); cursor: pointer }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg) }
.reg { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px }
.reg li { display: grid; grid-template-columns: minmax(0, 1.4fr) 110px 110px minmax(0, 1fr); gap: 4px 16px; align-items: center;
  padding: 10px 16px; border-bottom: 1px solid var(--line) }
.reg li:last-child { border-bottom: 0 }
.reg .rc { font-weight: 500; overflow-wrap: anywhere }
.reg .st { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 7px }
.reg .st.open { color: var(--ink); font-weight: 500 }
.reg .src, .reg .ats { font: 400 12px var(--mono); color: var(--muted) }
.reg .ats { text-align: right; overflow-wrap: anywhere }
.reg .ats a { color: var(--ink) }
.reg .ats a:hover { color: var(--accent) }
footer { color: var(--muted); font-size: 13px }
footer code { font: 12px var(--mono); color: var(--ink) }

@media (max-width: 820px) {
  .overview { grid-template-columns: minmax(0, 1fr) }
  .job { grid-template-columns: minmax(0, 1fr) }
  .job .acts { justify-content: flex-start }
  .reg li { grid-template-columns: minmax(0, 1fr) auto }
  .reg .src { display: none }
  .reg .ats { grid-column: 1 / -1; text-align: left }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important } }
</style>
<!--BODY-->
<div class="wrap">
  <header>
    <div class="topline">
      <span class="label">Internship Radar</span>
      <span class="label" id="checked"></span>
    </div>
    <h1 id="headline"></h1>
    <dl class="facts" id="facts"></dl>
  </header>

  <div class="overview">
    <section aria-labelledby="h-field">
      <h2 id="h-field">Scan-Feld</h2>
      <div class="field" id="field" aria-hidden="true"></div>
      <p class="hint" id="hint">Ein Punkt pro Company, alphabetisch. Farbige Punkte haben offene Stellen.</p>
    </section>
    <section aria-labelledby="h-ladder">
      <h2 id="h-ladder">Nach Standort-Priorität</h2>
      <ol class="ladder" id="ladder"></ol>
    </section>
  </div>

  <section aria-labelledby="h-jobs" style="display:flex;flex-direction:column;gap:20px">
    <div class="sec-head">
      <h2 id="h-jobs">Offene Stellen</h2>
      <button class="btn" id="clear" hidden>Filter zurücksetzen</button>
    </div>
    <div class="listings" id="listings"></div>
  </section>

  <section aria-labelledby="h-reg" style="display:flex;flex-direction:column;gap:16px">
    <div class="sec-head">
      <h2 id="h-reg">Alle Companies</h2>
      <span class="label" id="regcount"></span>
    </div>
    <div class="tools">
      <input class="search" id="q" type="search" placeholder="Company suchen …" aria-label="Company suchen">
      <div class="seg" id="seg" role="group" aria-label="Companies filtern">
        <button data-f="all" aria-pressed="true">Alle</button>
        <button data-f="open" aria-pressed="false">Mit Stellen</button>
        <button data-f="none" aria-pressed="false">Ohne Stellen</button>
        <button data-f="nolink" aria-pressed="false">Ohne Karriereseite</button>
      </div>
    </div>
    <ul class="reg" id="reg"></ul>
  </section>

  <footer>Quelle: <code>career_pages_full.csv</code>. Nach einem neuen Scan <code>python3 build.py</code> ausführen, um das Dashboard zu aktualisieren.</footer>
</div>

<script>
const DATA = /*__DATA__*/[];

// Location tiers in priority order (Munich first), with German labels.
const TIERS = [
  ["Munich", "München"],
  ["Germany (other city)", "Deutschland (andere Stadt)"],
  ["EU core (CH/FR/NL/IE/IT/ES)", "EU-Kern (CH/FR/NL/IE/IT/ES)"],
  ["Singapore", "Singapur"],
  ["Rest of Europe", "Restliches Europa"],
];
const tierIdx = t => { const i = TIERS.findIndex(x => x[0] === t); return i < 0 ? TIERS.length : i };
const tierName = i => i < TIERS.length ? TIERS[i][1] : "Sonstige";
const tierColor = i => `var(--t${i < TIERS.length ? i + 1 : 0})`;

const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e };
const safeUrl = u => /^https?:\/\//i.test(u || "") ? u : "";
const link = (href, text, cls) => { const a = el("a", cls, text); a.href = href; a.target = "_blank"; a.rel = "noopener"; return a };
const host = u => { try { return new URL(u).hostname.replace(/^www\./, "") } catch { return "" } };
const ATS = [["greenhouse", "Greenhouse"], ["ashbyhq", "Ashby"], ["personio", "Personio"], ["lever.co", "Lever"], ["recruitee", "Recruitee"],
  ["rippling", "Rippling"], ["workable", "Workable"], ["smartrecruiters", "SmartRecruiters"], ["workday", "Workday"], ["join.com", "JOIN"], ["teamtailor", "Teamtailor"]];
const atsName = u => { const h = host(u); const m = ATS.find(a => h.includes(a[0])); return m ? m[1] : h };

const rows = DATA.map((r, i) => ({ ...r, i, open: r.n > 0 || !!r.title, ti: tierIdx(r.tier) }));
const open = rows.filter(r => r.open).sort((a, b) => a.ti - b.ti || a.company.localeCompare(b.company));
const matches = rows.reduce((s, r) => s + r.n, 0);
let tierFilter = null, regFilter = "all";

// header
const fmtDate = d => { const m = /^(\d{4})-(\d\d)-(\d\d)$/.exec(d || ""); return m ? `${m[3]}.${m[2]}.${m[1]}` : d };
const last = rows.map(r => r.checked).sort().pop();
$("checked").textContent = last ? "Stand " + fmtDate(last) : "";
const h1 = $("headline");
h1.append(el("em", "", String(open.length)), ` von ${rows.length} Companies haben gerade offene Internships.`);
const fact = (n, label) => { const d = el("div"); d.append(el("dt", "", label), el("dd", "", String(n))); return d };
$("facts").append(
  fact(matches, "passende Stellen insgesamt"),
  fact(open.filter(r => r.ti === 0).length, "in München"),
  fact(open.filter(r => r.status === "NEW").length, "neu seit letztem Scan"),
  fact(rows.filter(r => !r.open).length, "ohne Treffer"));

// scan field
const hint = $("hint"), hintDefault = hint.textContent;
const dots = rows.map(r => {
  const b = el("button", "dot" + (r.open ? " on" : ""));
  b.tabIndex = -1; b.type = "button";
  if (r.open) b.style.setProperty("--c", tierColor(r.ti));
  b.onmouseenter = () => { hint.replaceChildren(el("b", "", r.company), r.open ? ` · ${r.n} ${r.n === 1 ? "Stelle" : "Stellen"} · ${tierName(r.ti)}` : " · keine Treffer") };
  b.onmouseleave = () => { hint.textContent = hintDefault };
  b.onclick = () => r.open ? jumpTo(r) : findInRegister(r.company);
  $("field").append(b);
  return b;
});

function jumpTo(r) {
  if (tierFilter !== null && tierFilter !== r.ti) setTier(null);
  const n = document.getElementById("job-" + r.i);
  if (!n) return;
  n.scrollIntoView({ behavior: "smooth", block: "center" });
  n.classList.remove("flash"); void n.offsetWidth; n.classList.add("flash");
}
function findInRegister(name) {
  $("q").value = name; setReg("all");
  $("h-reg").scrollIntoView({ behavior: "smooth", block: "start" });
}

// ladder
const usedTiers = [...new Set([...TIERS.keys(), ...open.map(r => r.ti)])].sort((a, b) => a - b);
const counts = Object.fromEntries(usedTiers.map(t => [t, open.filter(r => r.ti === t).length]));
const maxCount = Math.max(1, ...Object.values(counts));
const rungs = usedTiers.map(t => {
  const li = el("li"), b = el("button", "rung" + (counts[t] ? "" : " zero"));
  b.type = "button"; b.setAttribute("aria-pressed", "false"); b.style.setProperty("--c", tierColor(t));
  const track = el("span", "track"), bar = el("span", "bar");
  bar.style.width = (counts[t] / maxCount * 100) + "%"; track.append(bar);
  b.append(el("span", "name", tierName(t)), el("span", "n", String(counts[t])), track);
  b.onclick = () => setTier(tierFilter === t ? null : t);
  li.append(b); $("ladder").append(li);
  return [t, b];
});

function setTier(t) {
  tierFilter = t;
  rungs.forEach(([k, b]) => b.setAttribute("aria-pressed", String(k === t)));
  dots.forEach((d, i) => d.classList.toggle("dim", t !== null && !(rows[i].open && rows[i].ti === t)));
  $("clear").hidden = t === null;
  renderJobs();
}
$("clear").onclick = () => setTier(null);

// listings
function renderJobs() {
  const box = $("listings"); box.replaceChildren();
  const shown = open.filter(r => tierFilter === null || r.ti === tierFilter);
  if (!shown.length) { box.append(el("p", "empty", tierFilter === null ? "Aktuell keine offenen Stellen im Scan." : "Keine offenen Stellen in dieser Standort-Stufe.")); return }
  for (const t of usedTiers) {
    const g = shown.filter(r => r.ti === t); if (!g.length) continue;
    const sec = el("div", "group"), h = el("h3");
    const sw = el("span", "swatch"); sw.style.setProperty("--c", tierColor(t));
    h.append(sw, `${tierName(t)} · ${g.length}`); sec.append(h);
    for (const r of g) {
      const job = el("article", "job"); job.id = "job-" + r.i;
      const co = el("div", "co", r.company); if (r.status === "NEW") co.append(el("span", "badge", "NEU"));
      const role = el("div", "role");
      role.append(el("div", "title", r.title || "Stelle ohne Titel"));
      const extra = r.n > 1 ? ` · +${r.n - 1} weitere ${r.n - 1 === 1 ? "Stelle" : "Stellen"} auf der Karriereseite` : "";
      role.append(el("div", "meta", (r.loc || "Ort unbekannt") + extra));
      const acts = el("div", "acts"), u = safeUrl(r.url), b = safeUrl(r.board);
      if (b) acts.append(link(b, r.n > 1 ? `Alle ${r.n} ansehen` : "Karriereseite", "btn"));
      if (u) acts.append(link(u, "Stelle öffnen ↗", "btn go"));
      job.append(co, role, acts); sec.append(job);
    }
    box.append(sec);
  }
}

// register
function renderReg() {
  const q = $("q").value.trim().toLowerCase(), ul = $("reg"); ul.replaceChildren();
  const shown = rows.filter(r => r.company.toLowerCase().includes(q) &&
    (regFilter === "all" || (regFilter === "open" && r.open) || (regFilter === "none" && !r.open) || (regFilter === "nolink" && !safeUrl(r.board))));
  $("regcount").textContent = `${shown.length} von ${rows.length}`;
  if (!shown.length) { const li = el("li"); li.append(el("span", "st", "Keine Company passt zu diesem Filter.")); ul.append(li); return }
  for (const r of shown) {
    const li = el("li"), st = el("span", "st" + (r.open ? " open" : ""));
    if (r.open) { const sw = el("span", "swatch"); sw.style.setProperty("--c", tierColor(r.ti)); st.append(sw, `${r.n} offen`) } else st.textContent = "keine Treffer";
    const ats = el("span", "ats"), b = safeUrl(r.board);
    if (b) ats.append(link(b, atsName(b) + " ↗")); else ats.textContent = "kein Link";
    li.append(el("span", "rc", r.company), st, el("span", "src", r.web ? "Websuche" : "ATS-API"), ats);
    ul.append(li);
  }
}
function setReg(f) {
  regFilter = f;
  $("seg").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.f === f)));
  renderReg();
}
$("seg").onclick = e => { const b = e.target.closest("button"); if (b) setReg(b.dataset.f) };
$("q").oninput = renderReg;

renderJobs(); renderReg();
</script>
